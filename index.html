<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0"> <!-- عرض حاسوب عريض متناسق مع شاشات التلفاز -->

    <title>ATG PS4 Toolkit - Desktop Edition</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #2c2512 0%, #0d0d14 50%, #050508 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-x: auto;
        }

        .container {
            width: 1000px;
            background: rgba(14, 14, 19, 0.98);
            border: 1px solid #4a412d;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 50px rgba(214, 173, 85, 0.05);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .header-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #29251c;
            padding-bottom: 25px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 4px;
            color: #d6ad55;
            font-weight: 800;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo img {
            width: 180px;
            height: auto;
            border-radius: 8px;
            border: 1px solid #3a3424;
        }

        .dashboard-grid {
            display: flex;
            gap: 25px;
        }

        .monitor-panel {
            flex: 1.2;
            background: #08080c;
            border: 1px solid #221f18;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 220px;
        }

        .firmware {
            font-size: 42px;
            font-weight: bold;
            color: #d6ad55;
            font-family: monospace;
            text-shadow: 0 0 20px rgba(214, 173, 85, 0.2);
            margin-bottom: 15px;
        }

        .status {
            color: #aaa;
            font-size: 16px;
            line-height: 1.6;
            text-align: center;
            max-width: 90%;
        }

        .control-panel {
            flex: 0.8;
            background: #111116;
            border: 1px solid #29251c;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .start-btn {
            width: 100%;
            padding: 22px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #d6ad55 0%, #b8933f 100%);
            color: #050505;
            border: none;
            box-shadow: 0 6px 20px rgba(214, 173, 85, 0.2);
            text-transform: uppercase;
        }

        .start-btn:not(:disabled):hover {
            background: linear-gradient(135deg, #e5be6b 0%, #c9a34b 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(214, 173, 85, 0.35);
        }

        .start-btn:disabled {
            background: #1f1f24 !important;
            color: #444 !important;
            box-shadow: none;
            cursor: not-allowed;
            border: 1px solid #2a2a30;
        }

        .loader {
            display: none;
            margin-bottom: 15px;
            border: 4px solid #13131a;
            border-top: 4px solid #d6ad55;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #29251c;
            padding-top: 20px;
            color: #555;
            font-size: 13px;
        }

        .footer-panel strong {
            color: #8c7035;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER PANEL -->
    <div class="header-panel">
        <div class="brand-meta">
            <h1>PS4 TOOLKIT</h1>
            <div class="subtitle">Universal Intelligent Exploit Host • Desktop Station</div>
        </div>
        <div class="logo">
            <img src="./logo.png" alt="Ain Touila Gamers">
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard-grid">
        
        <!-- LEFT: MONITOR -->
        <div class="monitor-panel">
            <div class="loader" id="loader"></div>
            <div class="firmware" id="detectedFW">DETECTING...</div>
            <div class="status" id="status">Reading hardware environment data via User-Agent string...</div>
        </div>

        <!-- RIGHT: OPERATIONS -->
        <div class="control-panel">
            <div class="panel-title">Execution Console</div>
            <button class="start-btn" id="startBtn" onclick="launchExploit()">Execute Host</button>
        </div>

    </div>

    <!-- FOOTER PANEL -->
    <div class="footer-panel">
        <div>System Engine: <strong>AUTOMATIC FIRMWARE INJECTION (LOCAL WEBHOST)</strong></div>
        <div>&copy; 2026 <strong>AIN TOUILA GAMERS</strong></div>
    </div>

</div>

<script>
    const detectedFW = document.getElementById("detectedFW");
    const status = document.getElementById("status");
    const loader = document.getElementById("loader");
    const startBtn = document.getElementById("startBtn");

    let p4Version = "11.00"; 

    function detectPS4Firmware() {
        const ua = navigator.userAgent;
        
        if (ua.indexOf("PlayStation 4") !== -1) {
            let softwareVersion = ua.substring(ua.indexOf("PlayStation 4/") + 14, ua.indexOf("PlayStation 4/") + 19);
            p4Version = softwareVersion.trim();
            
            detectedFW.textContent = "SYS STATUS: FW " + p4Version;
            status.textContent = "PS4 Hardware detected. Ready to mount the kernel sandbox environment.";
            status.style.color = "#34c759";
        } else {
            detectedFW.textContent = "STATION: PC MODE";
            status.textContent = "Environment simulation enabled. Default target set to FW 11.00.";
            status.style.color = "#888";
        }
    }

    window.onload = detectPS4Firmware;

    function launchExploit() {
        startBtn.disabled = true;
        loader.style.display = "block";
        detectedFW.style.display = "none";
        status.style.color = "#d6ad55";

        status.textContent = "[STATION] Allocating virtual WebKit memory pages...";

        setTimeout(() => {
            status.textContent = "[STATION] Redirection sequence engaged. Running local exploit engine...";
            // التوجيه المباشر لتشغيل ملف الثغرة الفعلي jb.html المرفوع في حسابك
            window.location.href = "./jb.html";
        }, 1500);
    }
</script>

</body>
</html>
